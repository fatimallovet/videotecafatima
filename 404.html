<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Videoteca Fátima</title>
<link rel="icon" type="image/svg+xml" href="/videotecafatima/favicon.svg">
<script>
  /* Red de seguridad: un enlace compartido …/p/peliculas/<slug>/ de un título tan nuevo que
     todavía no tiene su página (se generan una vez al día) cae aquí. Se manda a la ficha. */
  (function () {
    var m = location.pathname.match(/^(.*?\/)p\/(peliculas|series)\/([^\/]+)/);
    if (m) location.replace(m[1] + "#" + m[2] + "/" + m[3]);
  })();
</script>

</head>

</body>
</html>
